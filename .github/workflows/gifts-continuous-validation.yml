name: Gifts continuous 60 minute validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gifts-continuous-validation.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: gifts-continuous-validation
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Restore most recent market evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p capture
          checkpoint=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name == "gifts-validation-checkpoint" or .name == "gifts-market-evidence" or .name == "gifts-report-evidence" or .name == "gifts-coverage-evidence" or .name == "gifts-continuous-evidence"))] | sort_by(.created_at) | last | [.workflow_run.id,.name] | @tsv')
          if [ -n "$checkpoint" ]; then
            read -r source_run source_name <<< "$checkpoint"
            gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name "$source_name" --dir capture
            echo "EVIDENCE_RESTORED: true"
          else
            echo "EVIDENCE_RESTORED: false; fresh sample will be labelled"
          fi
      - name: Verify existing pipeline
        run: python -m unittest test_guest_pipeline test_telegram_alerts
      - name: Observe one continuous hour with recorded connection gaps
        run: |
          pip -q install websockets==16.0
          python - <<'PY'
          import asyncio,json,time
          from pathlib import Path
          import guest_pipeline as pipeline
          directory=Path("capture")
          original=pipeline.export
          last_export=0
          cached={}
          def throttled(db,path,counters):
              global last_export,cached
              if time.monotonic()-last_export>=60 or not cached:
                  cached=original(db,path,counters)
                  last_export=time.monotonic()
              return cached
          pipeline.export=throttled
          async def run():
              start=time.time()
              deadline=time.monotonic()+3600
              attempts=[]
              while time.monotonic()<deadline:
                  began=time.time()
                  outcome="completed"
                  try:
                      await pipeline.capture(max(1,int(deadline-time.monotonic())),directory)
                  except Exception:
                      outcome="disconnected"
                  attempts.append({"started":began,"ended":time.time(),"outcome":outcome})
                  Path("capture/connection-windows.json").write_text(json.dumps({"started":start,"attempts":attempts,"requested_seconds":3600,"replay_available":False},indent=2))
                  print("CONNECTION_WINDOW:",json.dumps(attempts[-1]),flush=True)
                  if outcome=="disconnected":
                      await asyncio.sleep(min(5,max(0,deadline-time.monotonic())))
              db=pipeline.database(directory/"market.sqlite")
              print("FINAL_SUMMARY:",json.dumps(original(db,directory,{})),flush=True)
              db.close()
          asyncio.run(run())
          PY
      - name: Audit actual comparable coverage without changing valuation
        run: |
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          from collections import Counter
          from statistics import median
          path=Path("capture/market.sqlite")
          if not path.exists(): raise SystemExit("No preserved market evidence; no result fabricated")
          db=sqlite3.connect(path)
          events=[json.loads(r[0]) for r in db.execute("SELECT payload FROM events")]
          sales=[e for e in events if e["event"]=="sale" and e.get("price_ton") is not None]
          listings=[e for e in events if e["event"] in ("listing","price") and e.get("price_ton") is not None]
          levels={"exact":("slug","model","backdrop","pattern"),"model_backdrop":("slug","model","backdrop"),"model":("slug","model")}
          report={"sales_ton":len(sales),"listing_or_price_events_ton":len(listings),"levels":{},"method":"Only prior sales received before each event; unique other gifts; 7-day window. Broader groups are coverage diagnostics, not fair value or buy signals."}
          def key(e,fields):
              g=e["gift"]
              return tuple(g.get(f) for f in fields) if all(g.get(f) for f in fields) else None
          for level,fields in levels.items():
              counts=[]
              for listing in listings:
                  k=key(listing,fields)
                  others={}
                  if k:
                      for s in sorted(sales,key=lambda e:e["at"]):
                          if key(s,fields)==k and s["gift"]["num"]!=listing["gift"]["num"] and listing["at"]-604800<=s["at"]<=listing["at"] and s["observed_at"]<=listing["observed_at"]:
                              others[(s["gift"]["slug"],s["gift"]["num"])]=s
                  counts.append(len(others))
              errors=[]
              for target in sales:
                  k=key(target,fields)
                  earlier={}
                  if k:
                      for s in sorted(sales,key=lambda e:e["at"]):
                          if key(s,fields)==k and s["gift"]["num"]!=target["gift"]["num"] and target["at"]-604800<=s["at"]<target["at"] and s["observed_at"]<=target["observed_at"]:
                              earlier[(s["gift"]["slug"],s["gift"]["num"])]=s
                  if len(earlier)>=5:
                      estimate=median(s["price_ton"] for s in earlier.values())
                      errors.append(abs(estimate-target["price_ton"])/target["price_ton"])
              report["levels"][level]={"events_with_5_prior_other_sales":sum(n>=5 for n in counts),"max_comparables":max(counts,default=0),"sale_prediction_samples":len(errors),"median_absolute_percentage_error":median(errors) if errors else None}
          Path("capture/coverage-audit.json").write_text(json.dumps(report,indent=2))
          print("COVERAGE_AUDIT:",json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gifts-continuous-evidence
          path: capture/
          retention-days: 14
